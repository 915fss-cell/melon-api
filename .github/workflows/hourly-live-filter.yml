name: Hourly Melon snapshot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-live-filter
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scrape Live Filter and save a snapshot
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --connect-timeout 15 --max-time 240 "https://melon-api-orcin.vercel.app/api/playlist/live-filter")"
          printf '%s' "$response" | jq -e '
            if .snapshotSaved == true then
              { snapshotSaved, updatedAt, trackCount: (.tracks | length), unavailableCharts }
            else
              error("Live Filter snapshot was not saved")
            end
          '
